project:
  output_dir: outputs/ae_compare

data:
  dataset_dir: KukaVelocityDataset
  column_names_file: KukaColumnNames.npy
  normal_file: KukaNormal.npy
  slow_file: KukaSlow.npy
  action_column_index: 0
  anomaly_column_name: anomaly
  expected_normal_columns: 86
  expected_slow_columns: 87
  train_fraction: 0.70
  validation_fraction: 0.15
  feature_range:
    min: -1.0
    max: 1.0
  window_length: 128
  train_stride: 32
  eval_stride: 128

model:
  encoder_channels:
    - 64
    - 32
  batch_size: 256
  epochs: 60
  learning_rate: 0.001
  patience: 10
  gradient_clip: 1.0
  seed: 42

adversarial:
  generator_learning_rate: 0.001
  discriminator_learning_rate: 0.0001
  lambda_adv: 0.01
  betas:
    - 0.5
    - 0.999
